<!DOCTYPE html>
<html>
<head>
    <title>MakeCode Collab</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            padding-top: 60px;
        }

        button {
            padding: 12px 25px;
            margin: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        input {
            padding: 12px;
            font-size: 18px;
            width: 200px;
            text-transform: uppercase;
        }

        #code {
            font-size: 35px;
            font-weight: bold;
            margin: 25px;
        }

        #status {
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>🎮 MakeCode Collab</h1>

    <button onclick="createRoom()">Create Game</button>

    <br>

    <input id="roomCode" placeholder="ROOM CODE">
    <button onclick="joinRoom()">Join Game</button>

    <div id="code"></div>
    <div id="status">Not connected</div>

    <script>
        const SERVER = "wss://makecode-collab.onrender.com";

        let socket;

        function connect() {
            socket = new WebSocket(SERVER);

            socket.onopen = () => {
                document.getElementById("status").textContent =
                    "🟢 Connected to server";
            };

            socket.onclose = () => {
                document.getElementById("status").textContent =
                    "🔴 Disconnected";
            };

            socket.onmessage = (event) => {
                const message = JSON.parse(event.data);

                if (message.type === "created") {
                    document.getElementById("code").textContent =
                        "ROOM CODE: " + message.code;
                }

                if (message.type === "playerJoined") {
                    document.getElementById("status").textContent =
                        "🟢 Friend joined!";
                }

                if (message.type === "error") {
                    alert(message.message);
                }
            };
        }

        function createRoom() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                connect();

                setTimeout(() => {
                    socket.send(JSON.stringify({
                        type: "create"
                    }));
                }, 500);

                return;
            }

            socket.send(JSON.stringify({
                type: "create"
            }));
        }

        function joinRoom() {
            const code =
                document.getElementById("roomCode").value.toUpperCase();

            if (!code) {
                alert("Enter a room code!");
                return;
            }

            if (!socket || socket.readyState !== WebSocket.OPEN) {
                connect();

                setTimeout(() => {
                    socket.send(JSON.stringify({
                        type: "join",
                        code: code
                    }));
                }, 500);

                return;
            }

            socket.send(JSON.stringify({
                type: "join",
                code: code
            }));
        }
    </script>

</body>
</html>
