<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MakeCode Collab</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        #top {
            padding: 15px;
            background: #222;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button, input {
            font-size: 16px;
            padding: 10px;
        }

        #editor {
            width: 100%;
            height: calc(100vh - 75px);
            box-sizing: border-box;
            background: #181818;
            color: white;
            border: 0;
            outline: none;
            padding: 20px;
            font-family: monospace;
            font-size: 16px;
            resize: none;
        }

        #code {
            font-weight: bold;
        }

        #status {
            margin-left: auto;
        }
    </style>
</head>

<body>

<div id="top">
    <button onclick="createRoom()">Create Game</button>

    <input id="roomInput" placeholder="ROOM CODE">

    <button onclick="joinRoom()">Join Game</button>

    <span id="code"></span>
    <span id="status">🔴 Not connected</span>
</div>

<textarea id="editor" placeholder="Write your MakeCode code here..."></textarea>

<script>
    const SERVER = "wss://makecode-collab.onrender.com";

    let socket = null;
    let room = null;
    let updatingFromServer = false;

    function connect() {
        socket = new WebSocket(SERVER);

        socket.onopen = () => {
            document.getElementById("status").textContent =
                "🟢 Connected";
        };

        socket.onclose = () => {
            document.getElementById("status").textContent =
                "🔴 Disconnected";
        };

        socket.onmessage = (event) => {
            const message = JSON.parse(event.data);

            if (message.type === "created") {
                room = message.code;

                document.getElementById("code").textContent =
                    "Room: " + room;
            }

            if (message.type === "playerJoined") {
                document.getElementById("status").textContent =
                    "🟢 Friend connected!";
            }

            if (message.type === "change") {
                updatingFromServer = true;

                document.getElementById("editor").value =
                    message.data;

                updatingFromServer = false;
            }

            if (message.type === "error") {
                alert(message.message);
            }
        };
    }

    function createRoom() {
        connectWhenReady(() => {
            socket.send(JSON.stringify({
                type: "create"
            }));
        });
    }

    function joinRoom() {
        const code =
            document.getElementById("roomInput").value
            .trim()
            .toUpperCase();

        if (!code) {
            alert("Enter a room code!");
            return;
        }

        connectWhenReady(() => {
            socket.send(JSON.stringify({
                type: "join",
                code: code
            }));

            room = code;
            document.getElementById("code").textContent =
                "Room: " + code;
        });
    }

    function connectWhenReady(action) {
        if (socket && socket.readyState === WebSocket.OPEN) {
            action();
            return;
        }

        connect();

        socket.addEventListener("open", action, {
            once: true
        });
    }

    document.getElementById("editor").addEventListener("input", () => {
        if (updatingFromServer) return;

        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        if (!room) return;

        socket.send(JSON.stringify({
            type: "change",
            data: document.getElementById("editor").value
        }));
    });
</script>

</body>
</html>
